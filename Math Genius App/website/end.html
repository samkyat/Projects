<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Results</title>
    <script src="./js/theme-init.js"></script>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/endPage.css" />
</head>
<body>
    <div class="container">
        <div id="endPage" class="flex-center flex-column">
            <h1>Session Results</h1>
            <div class="summary">
                <p id="modeLine"></p>
                <p id="scoreLine"></p>
                <p id="accuracyLine"></p>
                <p id="correctLine"></p>
                <p id="bonusLine"></p>
                <p id="bestLine"></p>
                <p id="opLine"></p>
            </div>
            <div class="actions">
                <button id="practiceOpBtn" class="btn">Practice again</button>
                <button id="progressBtn" class="btn">View progress</button>
                <button id="homeBtn" class="btn">Home</button>
            </div>
        </div>
    </div>
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode">Dark mode</button>
    <script type="module" src="./js/endPage.js"></script>
    <script type="module" src="./js/theme.js"></script>
</body>
</html>

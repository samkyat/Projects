<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/practice.css" />
    <link rel="stylesheet" href="./css/money.css" />
</head>
<body>
    <div class="container">
        <div id="game" class="flex-center flex-column">
            <div id="header">
                <h1 class="visually-hidden">Practice</h1>
                <p id="score" aria-live="polite">Score: 0</p>
                <p id="progress" aria-live="polite">Question: 0 / 0</p>
            </div>
            <div id="main">
                <p id="question" aria-live="polite"></p>
                <section id="moneyInterface" class="money-interface" hidden>
                    <h2 class="visually-hidden">Money selection</h2>
                    <div class="money-targets">
                        <p id="moneyTarget">Target: $0.00</p>
                        <p id="moneyCombinationTarget">Use: 0 pieces</p>
                    </div>
                    <div class="money-selection" id="moneySelection" aria-live="polite" aria-label="Selected money"></div>
                    <div class="money-total-row">
                        <span aria-live="polite">Total: <strong id="moneyTotal">$0.00</strong></span>
                        <span id="moneyCount" aria-live="polite">0 pieces</span>
                    </div>
                    <div id="moneyButtons" class="money-buttons"></div>
                    <button type="button" id="clearMoneyBtn" class="money-clear">Clear selection</button>
                </section>
                <label class="visually-hidden" for="answer">Answer</label>
                <input type="text" inputmode="decimal" pattern="[0-9\-\+\.]*" name="answer" id="answer">
                <button type="button" id="submitBtn">Submit Answer</button>
                <p id="status" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/PracticeApp.js"></script>
</body>
</html>
